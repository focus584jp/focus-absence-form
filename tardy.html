<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>遅刻連絡</title>
  <script>
    // この画面は「遅刻」専用。種別は見出し等にハードコード済み。
    window.__formType = '遅刻';
    window.__liffId = '2010272855-tp08VhAe'; // 遅刻用LIFF ID
  </script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
  <script src="app.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #FEFCEC; /* 遅刻＝ごく薄い黄色 */
      padding: 16px;
      color: #333333;
    }
    .classroom-display {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #eeeeee;
      color: #333333;
      font-size: 16px;
    }
    .form-group {
      background: white;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 17px;
      color: #222;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      background: #fff;
      color: #333333;
      appearance: none;
    }
    .field-error {
      color: #c62828;
      font-size: 13px;
      font-weight: bold;
      margin-left: 6px;
    }
    input.invalid, textarea.invalid {
      border-color: #c62828;
      background: #fff6f6;
    }
    .period-grid.invalid .period-item {
      border-color: #c62828;
    }
    .period-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .name-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .period-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      background: white;
    }
    .period-item.selected {
      border-color: #E8911E;
      background: #FCEBCF;
    }
    .period-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #E8911E;
    }
    .period-label { font-size: 15px; }
    .period-time { font-size: 12px; color: #888; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #E67832;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .submit-btn:disabled { background: #aaa; }
    .message { padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 15px; white-space: pre-line; }
    .message.error { background: #fdecea; color: #c62828; }
    .message.success { background: #D7ECDD; color: #1e6b3a; }
    #formTitle {
      display: inline-block;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: #E8911E; /* 遅刻＝オレンジバッジ */
      padding: 8px 18px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div id="message"></div>

  <form id="absenceForm" novalidate>
    <div class="form-group">
      <label>教室名</label>
      <div class="classroom-display" id="classroomDisplay">-</div>
      <script>try{var c=localStorage.getItem('lastClassroom');if(c)document.getElementById('classroomDisplay').textContent=c;}catch(e){}</script>
    </div>

    <div class="form-group">
      <label>生徒名 <span class="field-error" id="err-lastName"></span><span class="field-error" id="err-firstName"></span></label>
      <div class="name-grid">
        <input type="text" id="lastName" placeholder="姓：山田" required>
        <input type="text" id="firstName" placeholder="名：太郎" required>
      </div>
      <script>try{var ln=localStorage.getItem('lastName');if(ln)document.getElementById('lastName').value=ln;var fn=localStorage.getItem('firstName');if(fn)document.getElementById('firstName').value=fn;}catch(e){}</script>
    </div>

    <div class="form-group">
      <label for="absenceDate"><span id="dateLabelText">遅刻日</span> <span class="field-error" id="err-absenceDate"></span></label>
      <input type="date" id="absenceDate" required>
    </div>

    <div class="form-group">
      <label>時限 <span class="field-error" id="err-periodGrid"></span></label>
      <div class="period-grid" id="periodGrid"></div>
    </div>

    <div class="form-group">
      <label for="reason">理由 <span class="field-error" id="err-reason"></span></label>
      <textarea id="reason" rows="3" placeholder="例：腹痛のため" required></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">
      送信する
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
    </button>
  </form>
</body>
</html>
