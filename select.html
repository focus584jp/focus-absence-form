<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>生徒氏名 / 所属教室の登録</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #F2F4F7;
      padding: 16px;
      color: #333333;
    }
    .message { padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 15px; white-space: pre-line; }
    .message.error { background: #fdecea; color: #c62828; }
    /* 一式そろってから表示する */
    #picker { visibility: hidden; }
    .box { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .box label { display: block; font-size: 17px; font-weight: bold; color: #222; margin-bottom: 8px; }
    .name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .name-grid input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      background: #fff;
      color: #333333;
      appearance: none;
    }
    /* 未入力エラー時の赤枠（姓名 input／教室トリガー共通） */
    .name-grid input.input-error,
    .dd-trigger.input-error { border-color: #c62828; background: #fff7f7; }
    /* 教室のカスタムドロップダウン（スクロールが伝わるピーク＋フェード） */
    .dropdown { position: relative; }
    .dd-trigger {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d7dce6;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
      color: #333333;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .dropdown.open .dd-trigger { border-color: #143778; box-shadow: 0 0 0 3px rgba(20, 55, 120, 0.12); }
    .dd-trigger .dd-placeholder { color: #999; }
    .dd-caret { color: #8a93a6; font-size: 15px; line-height: 1; transition: transform .18s; }
    .dropdown.open .dd-caret { transform: rotate(180deg); }
    /* ポップ本体（角丸でクリップし、内側にリストとフェードを重ねる） */
    .dd-pop {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      background: #fff;
      border: 1px solid #e2e6ee;
      border-radius: 12px;
      z-index: 10;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(20, 55, 120, 0.16);
    }
    .dropdown.open .dd-pop { display: block; }
    .dd-list {
      list-style: none;
      max-height: 214px; /* 最後の1件を半分覗かせてスクロールを示唆 */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .dd-list::-webkit-scrollbar { width: 8px; }
    .dd-list::-webkit-scrollbar-track { background: #eef1f6; border-radius: 4px; }
    .dd-list::-webkit-scrollbar-thumb { background: #9fb2d6; border-radius: 4px; min-height: 36px; }
    .dd-list::-webkit-scrollbar-thumb:active { background: #143778; }
    .dd-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      font-size: 16px;
      color: #333333;
      cursor: pointer;
      transition: background .12s;
    }
    .dd-list li + li { border-top: 1px solid #f2f4f7; }
    .dd-list li:active { background: #f5f8fd; }
    .dd-list li.selected { background: #FCEBCF; color: #333333; font-weight: bold; }
    .dd-list li.selected::after { content: '✓'; color: #E67832; font-weight: bold; font-size: 18px; }
    /* 下端フェード（スクロール余地があるときだけ表示してスクロールを示唆） */
    .dd-fade {
      pointer-events: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 38px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #ffffff 70%);
      transition: opacity .15s;
    }
    /* 「まだ下がある＝スクロールできる」を伝える弾むシェブロン */
    /* 下向きの二重シェブロン（» を90度傾けたデザイン）。回転を保つため上下動はbottomで行う */
    .dd-fade::after {
      content: '»';
      position: absolute;
      left: 50%;
      bottom: 3px;
      color: #143778;
      font-size: 24px;
      font-weight: normal;
      line-height: 1;
      transform: translateX(-50%) rotate(90deg);
      transform-origin: center;
      animation: ddBounce 1s ease-in-out infinite;
    }
    @keyframes ddBounce {
      0%, 100% { bottom: 3px; }
      50% { bottom: -1px; }
    }
    .dd-fade.hidden { opacity: 0; }
    .err { color: #c62828; font-size: 13px; font-weight: bold; margin-left: 6px; }
    .note { font-size: 12px; color: #888; line-height: 1.5; margin-bottom: 10px; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #143778;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:disabled { background: #aaa; }
  </style>
</head>
<body>
  <div id="message"></div>
  <div id="picker">
    <div class="box">
      <label>生徒氏名 <span class="err" id="nameErr"></span></label>
      <p class="note">※ご兄弟は、どちらか一人を登録してください。（連絡時に変更可）</p>
      <div class="name-grid">
        <input type="text" id="lastName" placeholder="姓：山田">
        <input type="text" id="firstName" placeholder="名：太郎">
      </div>
    </div>
    <div class="box">
      <label>所属教室 <span class="err" id="roomErr"></span></label>
      <div class="dropdown" id="dropdown">
        <button type="button" class="dd-trigger" id="ddTrigger" aria-haspopup="listbox" aria-expanded="false">
          <span id="ddLabel" class="dd-placeholder">選択してください</span>
          <span class="dd-caret">▼</span>
        </button>
        <div class="dd-pop">
          <ul class="dd-list" id="ddList" role="listbox"></ul>
          <div class="dd-fade" id="ddFade"></div>
        </div>
      </div>
      <input type="hidden" id="classroomSelect" value="">
    </div>
    <button class="submit-btn" id="registerBtn">登録する</button>
  </div>

  <script>
    // ===== 設定 =====
    const LIFF_ID = '2010272855-LUwv7nxh';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbywAFTtPxH5dU4TVnBvXhbjQy10z7cqwWUS4P7q9bg6crE_v8Sfmz117cYfIWRtb7Cpgw/exec';
    // 即描画用フォールバック。最新はGASのgetConfigから取得して差し替える。
    const DEFAULT_CLASSROOMS = ['稲毛', '妙典', '西千葉', '都賀', '新検見川', '稲毛海岸', '蘇我', '五井', '四街道', '鎌取'];
    // ================

    let userId = null;
    let userIdReady = null; // liff.initでuserIdを取得する非同期処理（登録時に待つ）
    let submitting = false;

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.className = 'message ' + type;
      el.textContent = text;
    }

    let selectedClassroom = '';

    // 教室一覧をカスタムドロップダウンに描画（既存の選択は保持）
    function renderOptions(classrooms) {
      const list = document.getElementById('ddList');
      list.innerHTML = '';
      classrooms.forEach(function (name) {
        const li = document.createElement('li');
        li.textContent = name;
        li.dataset.value = name;
        li.setAttribute('role', 'option');
        if (name === selectedClassroom) li.classList.add('selected');
        li.addEventListener('click', function () { selectClassroom(name); });
        list.appendChild(li);
      });
    }

    function selectClassroom(name) {
      selectedClassroom = name;
      document.getElementById('classroomSelect').value = name;
      const lbl = document.getElementById('ddLabel');
      lbl.textContent = name;
      lbl.classList.remove('dd-placeholder');
      document.getElementById('ddTrigger').classList.remove('input-error');
      document.getElementById('roomErr').textContent = '';
      Array.prototype.forEach.call(document.querySelectorAll('#ddList li'), function (li) {
        li.classList.toggle('selected', li.dataset.value === name);
      });
      closeDropdown();
    }

    // スクロール余地があるときだけ下端フェードを出す（スクロール可能の示唆）
    function updateFade() {
      const list = document.getElementById('ddList');
      const fade = document.getElementById('ddFade');
      const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 4;
      const noScroll = list.scrollHeight <= list.clientHeight + 1;
      fade.classList.toggle('hidden', atBottom || noScroll);
    }

    function openDropdown() {
      document.getElementById('dropdown').classList.add('open');
      document.getElementById('ddTrigger').setAttribute('aria-expanded', 'true');
      requestAnimationFrame(updateFade);
    }
    function closeDropdown() {
      document.getElementById('dropdown').classList.remove('open');
      document.getElementById('ddTrigger').setAttribute('aria-expanded', 'false');
    }
    function toggleDropdown() {
      if (document.getElementById('dropdown').classList.contains('open')) closeDropdown();
      else openDropdown();
    }

    // GASから教室一覧を取得（JSONP。別オリジンのためscriptタグで読む）
    function fetchClassroomsJsonp() {
      return new Promise(function (resolve) {
        const cb = 'jsonp_' + Date.now();
        const script = document.createElement('script');
        const timer = setTimeout(function () { cleanup(); resolve(null); }, 8000);
        function cleanup() {
          clearTimeout(timer);
          delete window[cb];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
        window[cb] = function (data) {
          cleanup();
          resolve(data && data.classrooms && data.classrooms.length ? data.classrooms : null);
        };
        script.onerror = function () { cleanup(); resolve(null); };
        script.src = GAS_URL + '?action=getConfig&callback=' + cb;
        document.body.appendChild(script);
      });
    }

    async function register() {
      if (submitting) return;
      const lnEl = document.getElementById('lastName');
      const fnEl = document.getElementById('firstName');
      const lastName = lnEl.value.trim();
      const firstName = fnEl.value.trim();
      const classroom = document.getElementById('classroomSelect').value;

      let bad = false;

      // 姓・名：未入力の欄を赤くし、どちらが欠けているかでメッセージを変える
      lnEl.classList.toggle('input-error', !lastName);
      fnEl.classList.toggle('input-error', !firstName);
      let nameMsg = '';
      if (!lastName && !firstName) nameMsg = '※姓・名を入力してください';
      else if (!lastName) nameMsg = '※姓を入力してください';
      else if (!firstName) nameMsg = '※名を入力してください';
      document.getElementById('nameErr').textContent = nameMsg;
      if (nameMsg) bad = true;

      // 教室：未選択ならトリガーを赤くしてメッセージ表示
      const trigger = document.getElementById('ddTrigger');
      trigger.classList.toggle('input-error', !classroom);
      document.getElementById('roomErr').textContent = classroom ? '' : '※教室を選択してください';
      if (!classroom) bad = true;

      if (bad) return;

      submitting = true;
      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.textContent = '登録中…';

      try {
        await userIdReady;
        if (!userId) {
          throw new Error('ユーザー情報を取得できませんでした。一度閉じて開き直してください。');
        }
        // 次回フォームの即時プリフィル用に端末へ保存（教室名も保存し、初回フォーム表示から即時化）
        try {
          localStorage.setItem('lastName', lastName);
          localStorage.setItem('firstName', firstName);
          localStorage.setItem('lastClassroom', classroom);
        } catch (e) {}
        // GASは別オリジンのためCORSでレスポンスを読めない。no-corsで送信し、
        // 確認はGASからのLINEプッシュメッセージで通知される。
        await fetch(GAS_URL + '?action=register_classroom', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ userId: userId, classroom: classroom, lastName: lastName, firstName: firstName }),
        });
        if (liff.isInClient()) {
          liff.closeWindow();
        } else {
          showMessage(classroom + '教室で登録しました。', 'error');
        }
      } catch (err) {
        showMessage('登録に失敗しました: ' + err.message, 'error');
        submitting = false;
        btn.disabled = false;
        btn.textContent = '登録する';
      }
    }

    function main() {
      // 初期値で即描画
      renderOptions(DEFAULT_CLASSROOMS);
      document.getElementById('picker').style.visibility = 'visible';

      // 裏で最新の教室一覧を取得し、変わっていれば描き直す（登録操作中は触らない）
      fetchClassroomsJsonp().then(function (latest) {
        if (latest && !submitting && JSON.stringify(latest) !== JSON.stringify(DEFAULT_CLASSROOMS)) {
          renderOptions(latest);
        }
      });

      document.getElementById('registerBtn').addEventListener('click', register);

      // カスタムドロップダウンの開閉（外側タップで閉じる）
      document.getElementById('ddTrigger').addEventListener('click', function (e) {
        e.stopPropagation();
        toggleDropdown();
      });
      document.addEventListener('click', function (e) {
        if (!document.getElementById('dropdown').contains(e.target)) closeDropdown();
      });
      document.getElementById('ddList').addEventListener('scroll', updateFade);

      // 一度エラー表示された後だけ、入力に合わせて赤枠とメッセージを更新する
      ['lastName', 'firstName'].forEach(function (id) {
        document.getElementById(id).addEventListener('input', function () {
          const lnEl = document.getElementById('lastName');
          const fnEl = document.getElementById('firstName');
          const alreadyShown = lnEl.classList.contains('input-error')
            || fnEl.classList.contains('input-error')
            || document.getElementById('nameErr').textContent;
          if (!alreadyShown) return;
          const lnBad = !lnEl.value.trim();
          const fnBad = !fnEl.value.trim();
          lnEl.classList.toggle('input-error', lnBad);
          fnEl.classList.toggle('input-error', fnBad);
          let msg = '';
          if (lnBad && fnBad) msg = '※姓・名を入力してください';
          else if (lnBad) msg = '※姓を入力してください';
          else if (fnBad) msg = '※名を入力してください';
          document.getElementById('nameErr').textContent = msg;
        });
      });

      // userIdは裏で並行取得。登録時に userIdReady を待つ。
      userIdReady = (async function () {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          const profile = await liff.getProfile();
          userId = profile.userId;
        } catch (err) {
          showMessage('ユーザー情報の取得に失敗しました: ' + err.message, 'error');
        }
      })();
    }

    main();
  </script>
</body>
</html>
