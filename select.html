<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>生徒名 / 所属教室の登録</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #F2F4F7;
      padding: 16px;
      color: #333333;
    }
    .message { padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 15px; white-space: pre-line; }
    .message.error { background: #fdecea; color: #c62828; }
    /* 一式そろってから表示する */
    #picker { visibility: hidden; }
    .box { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .box label { display: block; font-size: 17px; font-weight: bold; color: #222; margin-bottom: 8px; }
    .name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .name-grid input, #classroomSelect {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      background: #fff;
      color: #333333;
    }
    .name-grid input { appearance: none; }
    .err { color: #c62828; font-size: 13px; font-weight: bold; margin-left: 6px; }
    .note { font-size: 12px; color: #888; line-height: 1.5; margin-bottom: 10px; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #143778;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:disabled { background: #aaa; }
  </style>
</head>
<body>
  <div id="message"></div>
  <div id="picker">
    <div class="box">
      <label>生徒氏名 <span class="err" id="nameErr"></span></label>
      <p class="note">※ご兄弟は、どちらか一人を登録してください。（連絡時に変更可）</p>
      <div class="name-grid">
        <input type="text" id="lastName" placeholder="姓：山田">
        <input type="text" id="firstName" placeholder="名：太郎">
      </div>
    </div>
    <div class="box">
      <label>在籍教室 <span class="err" id="roomErr"></span></label>
      <select id="classroomSelect"><option value="">選択してください</option></select>
    </div>
    <button class="submit-btn" id="registerBtn">登録する</button>
  </div>

  <script>
    // ===== 設定 =====
    const LIFF_ID = '2010272855-LUwv7nxh';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbywAFTtPxH5dU4TVnBvXhbjQy10z7cqwWUS4P7q9bg6crE_v8Sfmz117cYfIWRtb7Cpgw/exec';
    // 即描画用フォールバック。最新はGASのgetConfigから取得して差し替える。
    const DEFAULT_CLASSROOMS = ['稲毛', '妙典', '西千葉', '都賀', '新検見川', '稲毛海岸', '蘇我', '五井', '四街道', '鎌取'];
    // ================

    let userId = null;
    let userIdReady = null; // liff.initでuserIdを取得する非同期処理（登録時に待つ）
    let submitting = false;

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.className = 'message ' + type;
      el.textContent = text;
    }

    // 教室一覧をプルダウンに描画（既存の選択は保持）
    function renderOptions(classrooms) {
      const sel = document.getElementById('classroomSelect');
      const cur = sel.value;
      sel.innerHTML = '<option value="">選択してください</option>';
      classrooms.forEach(function (name) {
        const o = document.createElement('option');
        o.value = name;
        o.textContent = name;
        sel.appendChild(o);
      });
      if (cur) sel.value = cur;
    }

    // GASから教室一覧を取得（JSONP。別オリジンのためscriptタグで読む）
    function fetchClassroomsJsonp() {
      return new Promise(function (resolve) {
        const cb = 'jsonp_' + Date.now();
        const script = document.createElement('script');
        const timer = setTimeout(function () { cleanup(); resolve(null); }, 8000);
        function cleanup() {
          clearTimeout(timer);
          delete window[cb];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
        window[cb] = function (data) {
          cleanup();
          resolve(data && data.classrooms && data.classrooms.length ? data.classrooms : null);
        };
        script.onerror = function () { cleanup(); resolve(null); };
        script.src = GAS_URL + '?action=getConfig&callback=' + cb;
        document.body.appendChild(script);
      });
    }

    async function register() {
      if (submitting) return;
      const lastName = document.getElementById('lastName').value.trim();
      const firstName = document.getElementById('firstName').value.trim();
      const classroom = document.getElementById('classroomSelect').value;

      let bad = false;
      if (!lastName || !firstName) { document.getElementById('nameErr').textContent = '※姓・名を入力してください'; bad = true; }
      else { document.getElementById('nameErr').textContent = ''; }
      if (!classroom) { document.getElementById('roomErr').textContent = '※教室を選択してください'; bad = true; }
      else { document.getElementById('roomErr').textContent = ''; }
      if (bad) return;

      submitting = true;
      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.textContent = '登録中…';

      try {
        await userIdReady;
        if (!userId) {
          throw new Error('ユーザー情報を取得できませんでした。一度閉じて開き直してください。');
        }
        // 次回フォームの即時プリフィル用に端末へ保存
        try { localStorage.setItem('lastName', lastName); localStorage.setItem('firstName', firstName); } catch (e) {}
        // GASは別オリジンのためCORSでレスポンスを読めない。no-corsで送信し、
        // 確認はGASからのLINEプッシュメッセージで通知される。
        await fetch(GAS_URL + '?action=register_classroom', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ userId: userId, classroom: classroom, lastName: lastName, firstName: firstName }),
        });
        if (liff.isInClient()) {
          liff.closeWindow();
        } else {
          showMessage(classroom + '教室で登録しました。', 'error');
        }
      } catch (err) {
        showMessage('登録に失敗しました: ' + err.message, 'error');
        submitting = false;
        btn.disabled = false;
        btn.textContent = '登録する';
      }
    }

    function main() {
      // 初期値で即描画
      renderOptions(DEFAULT_CLASSROOMS);
      document.getElementById('picker').style.visibility = 'visible';

      // 裏で最新の教室一覧を取得し、変わっていれば描き直す（登録操作中は触らない）
      fetchClassroomsJsonp().then(function (latest) {
        if (latest && !submitting && JSON.stringify(latest) !== JSON.stringify(DEFAULT_CLASSROOMS)) {
          renderOptions(latest);
        }
      });

      document.getElementById('registerBtn').addEventListener('click', register);

      // userIdは裏で並行取得。登録時に userIdReady を待つ。
      userIdReady = (async function () {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          const profile = await liff.getProfile();
          userId = profile.userId;
        } catch (err) {
          showMessage('ユーザー情報の取得に失敗しました: ' + err.message, 'error');
        }
      })();
    }

    main();
  </script>
</body>
</html>
