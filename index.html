<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>連絡</title>
  <script>
    // 種別・教室名をURLから即時確定。後続の各要素直後のインラインで適用し、
    // プログレッシブ描画やキャッシュ起因のちらつきを防ぐ。
    window.__params = new URLSearchParams(location.search);
    window.__formType = (window.__params.get('type') === '遅刻') ? '遅刻' : '欠席';
    window.__classroom = window.__params.get('classroom') || '';
    document.title = window.__formType + '連絡';
  </script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #F2F4F7;
      padding: 16px;
      color: #333333;
    }
    .classroom-display {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #eeeeee;
      color: #333333;
      font-size: 16px;
    }
    .form-group {
      background: white;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 17px;
      color: #143778;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      background: #fff;
      color: #333333;
      appearance: none;
    }
    .field-error {
      color: #c62828;
      font-size: 13px;
      font-weight: bold;
      margin-left: 6px;
    }
    input.invalid, textarea.invalid {
      border-color: #c62828;
      background: #fff6f6;
    }
    .period-grid.invalid .period-item {
      border-color: #c62828;
    }
    .period-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .name-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .period-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      background: white;
    }
    .period-item.selected {
      border-color: #143778;
      background: #DDE7F7;
    }
    .period-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #143778;
    }
    .period-label { font-size: 15px; }
    .period-time { font-size: 12px; color: #888; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #E67832;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .submit-btn:disabled { background: #aaa; }
    .message { padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 15px; white-space: pre-line; }
    .message.error { background: #fdecea; color: #c62828; }
    .message.success { background: #D7ECDD; color: #1e6b3a; }
    #formTitle { font-size: 18px; color: #143778; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1 id="formTitle"></h1>
  <script>document.getElementById('formTitle').textContent = window.__formType + '連絡';</script>

  <div id="message"></div>

  <form id="absenceForm" novalidate>
    <div class="form-group">
      <label>教室名</label>
      <div class="classroom-display" id="classroomDisplay">-</div>
      <script>if (window.__classroom) document.getElementById('classroomDisplay').textContent = window.__classroom;</script>
    </div>

    <div class="form-group">
      <label>生徒名 <span class="field-error" id="err-lastName"></span><span class="field-error" id="err-firstName"></span></label>
      <div class="name-grid">
        <input type="text" id="lastName" placeholder="姓：山田" required>
        <input type="text" id="firstName" placeholder="名：太郎" required>
      </div>
    </div>

    <div class="form-group">
      <label for="absenceDate"><span id="dateLabelText"></span> <span class="field-error" id="err-absenceDate"></span></label>
      <script>document.getElementById('dateLabelText').textContent = window.__formType + '日';</script>
      <input type="date" id="absenceDate" required>
    </div>

    <div class="form-group">
      <label>時限（複数選択可） <span class="field-error" id="err-periodGrid"></span></label>
      <div class="period-grid" id="periodGrid"></div>
    </div>

    <div class="form-group">
      <label for="reason">理由 <span class="field-error" id="err-reason"></span></label>
      <textarea id="reason" rows="3" placeholder="例：発熱のため" required></textarea>
      <script>if (window.__formType === '遅刻') document.getElementById('reason').placeholder = '例：腹痛のため';</script>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">送信する</button>
  </form>

  <script>
    // ===== 設定（環境に合わせて変更）=====
    const LIFF_ID = '2010272855-O3sIeywy';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbywAFTtPxH5dU4TVnBvXhbjQy10z7cqwWUS4P7q9bg6crE_v8Sfmz117cYfIWRtb7Cpgw/exec';
    const DEFAULT_PERIODS = [
      { label: '2限', time: '14:00〜' },
      { label: '3限', time: '15:00〜' },
      { label: '4限', time: '16:00〜' },
      { label: '5限', time: '17:00〜' },
      { label: '6限', time: '18:00〜' },
      { label: '7限', time: '19:00〜' },
      { label: '8限', time: '20:00〜' },
      { label: '9限', time: '21:00〜' },
    ];
    // =====================================

    let userId = null;
    let classroomName = '';

    // 種別はheadのインラインで確定済み（window.__formType）。見出し・ラベルも各要素直後で適用済み。
    const formType = window.__formType;

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.className = 'message ' + type;
      el.textContent = text;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // 各項目のタイトル横に警告を表示し、入力枠を赤くする
    function setFieldError(id, message) {
      const err = document.getElementById('err-' + id);
      if (err) err.textContent = '※' + message;
      const el = document.getElementById(id);
      if (el) el.classList.add('invalid');
    }

    function clearFieldError(id) {
      const err = document.getElementById('err-' + id);
      if (err) err.textContent = '';
      const el = document.getElementById(id);
      if (el) el.classList.remove('invalid');
    }

    function clearAllFieldErrors() {
      ['lastName', 'firstName', 'absenceDate', 'periodGrid', 'reason'].forEach(clearFieldError);
    }

    function buildPeriodGrid(periods) {
      const grid = document.getElementById('periodGrid');
      grid.innerHTML = '';
      periods.forEach(p => {
        const item = document.createElement('div');
        item.className = 'period-item';
        item.innerHTML =
          '<input type="checkbox" id="p_' + p.label + '" value="' + p.label + '(' + p.time + ')">' +
          '<div><div class="period-label">' + p.label + '</div>' +
          '<div class="period-time">' + p.time + '</div></div>';
        item.addEventListener('click', function(e) {
          const cb = this.querySelector('input');
          if (e.target !== cb) cb.checked = !cb.checked;
          this.classList.toggle('selected', cb.checked);
          clearFieldError('periodGrid');
        });
        grid.appendChild(item);
      });
    }

    // GASからuserIdで教室名を取得（JSONP。別オリジンのためscriptタグで読む）
    function fetchClassroom(uid) {
      return new Promise(function(resolve) {
        const cb = 'jsonp_' + Date.now();
        const script = document.createElement('script');
        const timer = setTimeout(function() { cleanup(); resolve(null); }, 8000);
        function cleanup() {
          clearTimeout(timer);
          delete window[cb];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
        window[cb] = function(data) {
          cleanup();
          resolve(data && data.classroom ? data.classroom : null);
        };
        script.onerror = function() { cleanup(); resolve(null); };
        script.src = GAS_URL + '?action=getClassroom&userId=' + encodeURIComponent(uid) + '&callback=' + cb;
        document.body.appendChild(script);
      });
    }

    function fetchConfigJsonp() {
      return new Promise(function (resolve) {
        const cb = 'jsonp_cfg_' + Date.now();
        const script = document.createElement('script');
        const timer = setTimeout(function () { cleanup(); resolve(null); }, 8000);
        function cleanup() {
          clearTimeout(timer);
          delete window[cb];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
        window[cb] = function (data) { cleanup(); resolve(data || null); };
        script.onerror = function () { cleanup(); resolve(null); };
        script.src = GAS_URL + '?action=getConfig&callback=' + cb;
        document.body.appendChild(script);
      });
    }

    function setTodayAsDefault() {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      document.getElementById('absenceDate').value = y + '-' + m + '-' + d;
    }

    document.getElementById('absenceForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      clearAllFieldErrors();

      if (!userId) {
        showMessage('ユーザー情報を取得できませんでした。一度閉じて開き直してください。', 'error');
        return;
      }

      const lastName = document.getElementById('lastName').value.trim();
      const firstName = document.getElementById('firstName').value.trim();
      const studentName = lastName + ' ' + firstName;
      const absenceDate = document.getElementById('absenceDate').value;
      const reason = document.getElementById('reason').value.trim();
      const periods = Array.from(document.querySelectorAll('#periodGrid input:checked'))
        .map(cb => cb.value);

      let firstInvalid = null;
      if (!lastName) { setFieldError('lastName', '姓を入力してください'); firstInvalid = firstInvalid || 'lastName'; }
      if (!firstName) { setFieldError('firstName', '名を入力してください'); firstInvalid = firstInvalid || 'firstName'; }
      if (!absenceDate) { setFieldError('absenceDate', '選択してください'); firstInvalid = firstInvalid || 'absenceDate'; }
      if (periods.length === 0) { setFieldError('periodGrid', '1つ以上選択してください'); firstInvalid = firstInvalid || 'periodGrid'; }
      if (!reason) { setFieldError('reason', '入力してください'); firstInvalid = firstInvalid || 'reason'; }
      if (firstInvalid) {
        document.getElementById(firstInvalid).scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      btn.disabled = true;
      btn.textContent = '送信中...';

      const payload = {
        userId: userId,
        type: formType,
        classroom: classroomName,
        studentName: studentName,
        absenceDate: absenceDate,
        periods: periods,
        reason: reason,
      };

      const payloadStr = JSON.stringify(payload);
      // GASは別オリジン＆no-corsでレスポンスを読めない。完了を待つ意味が薄いため
      // sendBeaconで投げて即カードを閉じる（受付確認はLINEプッシュで届く）。
      let sent = false;
      try {
        if (navigator.sendBeacon) {
          const blob = new Blob([payloadStr], { type: 'text/plain' });
          sent = navigator.sendBeacon(GAS_URL + '?action=absence', blob);
        }
      } catch (e) {
        sent = false;
      }
      if (!sent) {
        // 古いWebView等のフォールバック（完了は待たない）
        fetch(GAS_URL + '?action=absence', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: payloadStr,
        });
      }
      if (liff.isInClient()) {
        liff.closeWindow();
      } else {
        document.getElementById('absenceForm').style.display = 'none';
        showMessage('送信しました。', 'success');
      }
    });

    // liff 非依存。HTMLパース直後に即実行してフォームを描画する。
    function initFormUI() {
      buildPeriodGrid(DEFAULT_PERIODS);
      // 裏で最新の時限定義を取得。ユーザーが選択を始めていなければ差し替える
      fetchConfigJsonp().then(function (config) {
        const anyChecked = document.querySelectorAll('#periodGrid input:checked').length > 0;
        if (config && config.periods && config.periods.length && !anyChecked) {
          buildPeriodGrid(config.periods);
        }
      });
      setTodayAsDefault();
    }

    // liff 依存。SDK(defer)ロード後に走らせるため DOMContentLoaded で呼ぶ。
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (err) {
        showMessage('LIFFの初期化に失敗しました: ' + err.message, 'error');
        return;
      }

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      try {
        const profile = await liff.getProfile();
        userId = profile.userId;
      } catch (err) {
        showMessage('ユーザー情報の取得に失敗しました: ' + err.message, 'error');
        return;
      }

      // 教室名を決定：URLパラメータは既に即時表示済み。
      // 無い場合のみ、userIdからGASに問い合わせて補完する。
      if (!classroomName) {
        classroomName = await fetchClassroom(userId) || '';
      }
      if (classroomName) {
        document.getElementById('classroomDisplay').textContent = classroomName;
      } else {
        document.getElementById('classroomDisplay').textContent = '未登録';
        showMessage('教室が未登録です。LINEのメニューから教室登録を行ってください。', 'error');
      }
    }

    // 教室名はclassroomDisplay直後のインラインで即時表示済み（window.__classroom）。
    classroomName = window.__classroom;

    ['lastName', 'firstName', 'absenceDate', 'reason'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', function() { clearFieldError(id); });
    });

    // liff 非依存のUIは即描画。liff 依存処理は defer の SDK ロード後（DOMContentLoaded）に。
    initFormUI();
    document.addEventListener('DOMContentLoaded', initLiff);
  </script>
</body>
</html>
